name: Release Cutver Setup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Self-Version and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git bot credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dogfood Setup Cutver CLI
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Cutver Release
        id: cutver
        uses: Row0902/cutver-actions/release@v1
        with:
          command: "release"
          bump: "auto"
          check-changelog: "true"
          notes-file: "RELEASE_NOTES.md"
          template: ".github/templates/cutver/RELEASE.md"

      - name: Get latest release tag
        id: tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body_path: ${{ steps.cutver.outputs.notes-path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
