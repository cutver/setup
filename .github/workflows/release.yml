name: Cutver Setup

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "SemVer bump level"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: Self-Version and Release
    runs-on: ubuntu-latest
    steps:
      - name: Generate Cutver bot token
        id: bot-token
        if: env.CUTVER_APP_ID != '' && env.CUTVER_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CUTVER_APP_ID }}
          private-key: ${{ secrets.CUTVER_APP_PRIVATE_KEY }}
        env:
          CUTVER_APP_ID: ${{ secrets.CUTVER_APP_ID }}
          CUTVER_APP_PRIVATE_KEY: ${{ secrets.CUTVER_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.bot-token.outputs.token || github.token }}

      - name: Setup Git bot credentials
        run: |
          git config --global user.name "cutver-release[bot]"
          git config --global user.email "${{ secrets.CUTVER_APP_ID || 'github-actions' }}+cutver-release[bot]@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dogfood Setup Cutver CLI
        uses: ./
        with:
          github-token: ${{ steps.bot-token.outputs.token || secrets.GITHUB_TOKEN }}
          cache: "false"

      - name: Run Cutver Release
        id: cutver
        uses: cutver/release@v1
        with:
          command: "release"
          bump: ${{ inputs.bump || 'auto' }}
          check-changelog: "false"
          notes-file: "RELEASE_NOTES.md"
          template: ".github/templates/cutver/RELEASE.md"

      - name: Create GitHub Release
        if: steps.cutver.outputs.released == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.cutver.outputs.tag }}
          name: Release ${{ steps.cutver.outputs.tag }}
          body_path: ${{ steps.cutver.outputs.notes-path }}
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token || secrets.GITHUB_TOKEN }}
