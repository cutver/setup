name: "Setup Cutver"
description: "Download, cache, and add cutver CLI to the PATH"
author: "cutver"

branding:
  icon: "download"
  color: "blue"

inputs:
  version:
    description: 'Version of cutver to install (without "v", e.g. "0.1.0" or "latest")'
    required: false
    default: "latest"
  github-token:
    description: 'GitHub Token to authenticate requests when resolving "latest"'
    required: false
    default: ${{ github.token }}
  cache:
    description: 'Whether to use the runner tool-cache. Set to false to bypass local cache and force fresh download'
    required: false
    default: "true"
  plugins:
    description: 'Whether to install the plugin-enabled Cutver binary variant (cutver-plugins-*)'
    required: false
    default: "false"
  verify-checksum:
    description: 'Download the release SHA256SUMS and verify the archive digest before extracting it. Set to false only for releases published before SHA256SUMS existed; with verification disabled the archive is never verified'
    required: false
    default: "true"

outputs:
  installed-version:
    description: "The exact version of cutver that was installed"

runs:
  using: "node24"
  main: "dist/index.js"
